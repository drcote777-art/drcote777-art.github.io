<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Virtual Busan · 가상 부산·경남 3일</title>

<meta name="theme-color" content="#0f1d33">
<link rel="icon" href="assets3d/seoul-192.png">
<link rel="apple-touch-icon" href="assets3d/seoul-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0f1d33">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 화면 전체 3D 바다, 위아래로 얇은 항해 계기판 HUD */
:root{
  --navy:#0f1d33; --glass:rgba(12,24,44,.72); --line:rgba(227,184,96,.35);
  --brass:#e3b860; --sea:#4fc3c7; --ink:#f3ede0; --sub:#b9c3cf; --red:#d8594a;
  --disp:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%;overflow:hidden}
body{background:var(--navy);color:var(--ink);font-family:var(--body);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font-family:var(--body);color:var(--ink);background:var(--glass);border:1px solid var(--line);border-radius:12px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
button b{font-family:var(--disp);font-weight:400;display:block;font-size:15px;line-height:1.2}
button small{display:block;font-size:11.5px;color:var(--sub)}
.hud{position:fixed;left:0;right:0;z-index:5;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));pointer-events:none}
.hud>*{pointer-events:auto}
#top{top:0;padding-top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;flex-direction:column;gap:8px}
.place{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:8px 12px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);max-width:520px}
.place .tag{font-size:11.5px;letter-spacing:.06em;color:var(--brass)}
.place b{font-family:var(--disp);font-weight:400;font-size:21px;display:block;line-height:1.25}
.place span.s{font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.tb{display:flex;gap:6px;flex-wrap:wrap}
.tb button{font-size:13px;padding:6px 11px;border-radius:999px}
.tb button[aria-pressed="true"]{background:var(--brass);color:var(--navy);border-color:var(--brass)}
#bot{bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;flex-direction:column;gap:8px;max-width:560px;margin:0 auto}
.sub{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:14.5px;line-height:1.55;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .4s}
.sub b{font-family:var(--disp);font-weight:400;color:var(--brass);margin-right:6px}
.sub.off{opacity:0}
#acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
#acts::-webkit-scrollbar{display:none}
#acts button{flex:0 0 auto;padding:7px 12px;text-align:left}
#acts button.next{border-color:var(--sea);background:rgba(20,70,80,.75)}
.rail{position:relative;height:6px;border-radius:3px;background:rgba(255,255,255,.15);margin:2px 4px}
#fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--sea)}
#me{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 3px rgba(227,184,96,.3)}
.ctl{display:grid;grid-template-columns:1fr;gap:8px}
.ctl button{padding:9px 6px}
.ctl button[aria-pressed="true"]{background:var(--sea);color:var(--navy);border-color:var(--sea)}
.ctl button[aria-pressed="true"] small{color:var(--navy)}
.panel{position:fixed;inset:0;z-index:20;background:rgba(6,12,24,.6);display:flex;align-items:flex-end;justify-content:center}
.panel .in{background:#13233d;border:1px solid var(--line);border-radius:18px 18px 0 0;width:100%;max-width:560px;max-height:82%;overflow-y:auto;padding:16px max(16px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-right,0px))}
.panel h2{font-family:var(--disp);font-weight:400;font-size:22px;margin:0 0 4px;color:var(--brass)}
.panel p.lead{margin:0 0 12px;color:var(--sub);font-size:13.5px}
.day{border-top:1px solid rgba(255,255,255,.1);padding:10px 0}
.day .dh{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.day .dh b{font-family:var(--disp);font-weight:400;font-size:17px}
.day .dh i{font-style:normal;color:var(--brass);font-size:12.5px;letter-spacing:.05em}
.day .dt{color:var(--sub);font-size:12.5px;font-variant-numeric:tabular-nums}
.day .st{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.day .st button{font-size:13px;padding:5px 10px;border-radius:999px}
.day .st button.cur{background:var(--brass);color:var(--navy)}
.close{width:100%;margin-top:12px;padding:10px;font-family:var(--disp);font-size:16px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:8px 0}
.stp{aspect-ratio:1;max-width:100%;border:1.5px dashed rgba(255,255,255,.25);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;font-size:12px;color:var(--sub);padding:6px}
.stp b{font-family:var(--disp);font-weight:400;font-size:15px;color:var(--ink)}
.stp.on{border:3px double var(--c);color:var(--c);transform:rotate(-8deg);background:rgba(255,255,255,.04)}
.stp.on b{color:var(--c)}
.joy{position:fixed;z-index:6;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #ffffffaa;background:#ffffff22;pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ffffffcc}
.hint{position:fixed;z-index:6;left:50%;top:46%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13.5px;white-space:nowrap;pointer-events:none}
.tb a{font-size:13px;padding:6px 11px;border-radius:999px;color:var(--ink);text-decoration:none;background:var(--glass);border:1px solid var(--line)}
.talk{position:fixed;left:0;right:0;bottom:0;z-index:12;max-width:560px;margin:0 auto;background:#13233d;border:1px solid var(--line);border-radius:18px 18px 0 0;display:flex;flex-direction:column;max-height:58%;padding:10px max(14px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(14px,env(safe-area-inset-right,0px))}
.talk .th{display:flex;justify-content:space-between;align-items:center;gap:8px}
.talk .th b{font-family:var(--disp);font-weight:400;font-size:19px;color:var(--brass);display:block}
.talk .th small{color:var(--sub);font-size:12.5px}
.talk .th button{padding:6px 12px;border-radius:999px}
.tbody{overflow-y:auto;flex:1;min-height:90px;display:flex;flex-direction:column;gap:6px;padding:8px 0}
.tl{background:rgba(255,255,255,.06);border-radius:12px;padding:7px 10px;font-size:14.5px;line-height:1.55;max-width:88%;user-select:text;-webkit-user-select:text}
.tl b{display:block;font-size:12px;color:var(--brass);font-weight:400}
.tl.me{align-self:flex-end;background:rgba(79,195,199,.18)}
.tquick{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:none}
.tquick button{flex:0 0 auto;font-size:13px;padding:5px 10px;border-radius:999px}
.tin{display:flex;gap:6px}
.tin input{flex:1;min-width:0;font-family:var(--body);font-size:16px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:#0c1828;color:var(--ink)}
.tin button{padding:9px 14px;font-family:var(--disp);font-size:15px;background:var(--brass);color:var(--navy);border:none}
#fade{position:fixed;inset:0;z-index:25;background:#0b1526;display:flex;align-items:center;justify-content:center;padding:0 max(24px,env(safe-area-inset-left,0px));opacity:0;transition:opacity .45s}
#fade p{max-width:420px;text-align:center;font-size:17px;line-height:1.7;color:var(--ink)}
#toast{position:fixed;z-index:26;left:50%;top:calc(env(safe-area-inset-top,0px) + 120px);transform:translateX(-50%);background:var(--brass);color:var(--navy);font-family:var(--disp);font-size:15px;padding:8px 16px;border-radius:999px;white-space:nowrap;max-width:92%;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;padding:11px 12px;margin-bottom:6px;text-align:left;font-size:15px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.row b{font-variant-numeric:tabular-nums;color:var(--brass);font-weight:400;font-family:var(--disp)}
.row small{color:var(--sub)}
.panel h3{font-family:var(--disp);font-weight:400;color:var(--sea);margin:14px 0 6px;font-size:16px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button,.chips input{font-size:14px;padding:8px 12px;border-radius:999px}
.chips input{width:76px;background:#0c1828;color:var(--ink);border:1px solid var(--line);font-family:var(--body)}
.chips button[aria-pressed="true"]{background:var(--brass);color:var(--navy)}
.reels{display:flex;justify-content:center;gap:10px;margin:10px 0}
.reels span{width:70px;height:78px;display:flex;align-items:center;justify-content:center;font-size:40px;background:#0c1828;border:2px solid var(--brass);border-radius:12px;font-family:var(--disp);color:#ffd34d}
.res{text-align:center;font-family:var(--disp);font-size:17px;min-height:26px;margin:4px 0}
.rball{width:84px;height:84px;margin:10px auto 4px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:34px;background:#333;border:3px solid var(--brass)}
.rball.r{background:#b3202a}.rball.b{background:#111}.rball.g{background:#1f8a3a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.grid button{padding:10px;text-align:left}
.grid button.cur{border-color:var(--brass)}
.wal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.wal div{background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px}
.wal small{display:block;color:var(--sub);font-size:12px}
.wal b{font-family:var(--disp);font-weight:400;font-size:20px;color:var(--brass);font-variant-numeric:tabular-nums}
.reset{margin-top:16px;width:100%;padding:9px;font-size:13px;color:var(--sub)}
.qs{display:flex;flex-direction:column;gap:5px;margin-top:6px}
.qs button{text-align:left;padding:8px 10px;font-size:14px;display:flex;gap:8px;align-items:baseline}
.qs button.ok{opacity:.6}
.qs .qt{flex:0 0 52px;color:var(--brass);font-size:12.5px;font-variant-numeric:tabular-nums}
.day.cur .dh b{color:var(--brass)}
.dh .cnt{margin-left:auto;color:var(--sub);font-size:12.5px}
#flash{position:fixed;inset:0;z-index:15;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
#splash{position:fixed;inset:0;z-index:14;background:rgba(40,160,200,.55);opacity:0;pointer-events:none;transition:opacity .7s}
#start{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0f1d33 0%,#173a5c 55%,#d98c5f 100%);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#start .card{max-width:420px;text-align:center}
#start .eyebrow{font-size:12px;letter-spacing:.18em;color:var(--brass)}
#start h1{font-family:var(--disp);font-weight:400;font-size:38px;line-height:1.15;margin:6px 0 10px;text-wrap:balance}
#start p{color:var(--ink);opacity:.88;line-height:1.7;margin:0 0 10px;font-size:15px}
#start .route{font-size:13px;color:var(--brass);letter-spacing:.02em;margin:0 0 18px}
#enter{font-family:var(--disp);font-size:20px;padding:12px 34px;border-radius:999px;background:var(--brass);color:var(--navy);border:none}
#enter:disabled{opacity:.5}
#loading{display:block;margin-top:10px;font-size:13px;color:var(--sub)}
@media (prefers-reduced-motion:reduce){.sub,#flash,#splash{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="flash"></div><div id="splash"></div>

<div class="hud" id="top">
  <div class="place"><span class="tag" id="dayTag">DAY 1</span><b id="placeName"></b><span class="s" id="placeSub"></span><span class="s" id="wx" style="color:var(--brass);display:block"></span></div>

<div class="panel" id="pan" hidden><div class="in">

</div>
<div id="fade" hidden><p id="fadeT"></p></div>
<div id="toast" hidden></div>
<style>.gbox{background:#fff;color:#1b1b1b;border-radius:14px;overflow:auto;max-height:50vh;margin:6px 0 10px;color-scheme:light}.gbox.off{background:rgba(255,255,255,.08);color:var(--ink);padding:10px 12px;font-size:14px;line-height:1.5;max-height:none;overflow:visible}.gbox.off p{margin:0 0 6px}.gbox.off small{display:block;opacity:.75;margin-top:8px;font-size:12px}.gbox .gwait{padding:14px;font-size:14px;color:#555}.gbox.off .gwait{color:inherit;padding:0}gmp-place-search,gmp-place-details,gmp-place-details-compact{display:block;width:100%}.panel .ocb a{background:rgba(255,255,255,.1);color:var(--ink);border-color:rgba(255,255,255,.25)}.panel .ocb .pri{background:var(--brass);color:var(--navy);border-color:transparent}.fdl small.fdn{flex-basis:100%;font-size:11.5px;opacity:.75;text-align:center;margin-top:2px}.fdh{margin:10px 0 2px;font-size:13.5px;color:var(--brass)}</style>
<style>.oc{align-self:stretch;background:#f7f1e3;color:#1d1915;border-radius:14px;padding:9px 10px;font-size:14px;line-height:1.45}.oc h4{margin:0 0 4px;font-size:12.5px;color:#7a5a1a;font-weight:700}.oc p{margin:0}.oc-info{background:rgba(255,255,255,.08);color:var(--ink);font-size:13px}.oc-ok{background:#e4f3ea}.oci{display:flex;gap:8px;align-items:center;padding-top:6px}.oce{font-size:26px;width:34px;text-align:center;flex:0 0 34px}.oci div{flex:1;min-width:0}.oci div b{display:block;font-size:14.5px}.oci div small{color:#6b6250;font-size:12px}.ocp{color:#9a3324;font-variant-numeric:tabular-nums;white-space:nowrap}.ocb{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.ocb button,.ocb a{flex:1 1 auto;padding:7px 10px;border-radius:999px;border:1px solid #c9b88f;background:#fff;color:#1d1915;font-size:13px;text-align:center;text-decoration:none;line-height:1.3}.ocb .pri{background:#1f2f4a;color:#fff;border-color:#1f2f4a}.oc-info .ocb a,.oc-info .ocb button,.panel .ocb button{background:rgba(255,255,255,.1);color:var(--ink);border-color:rgba(255,255,255,.25)}.cpn{border:2px dashed #c9a23f;border-radius:12px;padding:8px;text-align:center}.cpn b{display:block;font-size:16.5px}.cpn code{display:block;font-size:17px;letter-spacing:.08em;margin:4px 0;font-family:ui-monospace,monospace}.cpn small{color:#6b6250;font-size:12px}.ochips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}.ochips button{padding:8px 12px;border-radius:999px;font-size:14px}.ochips button.on{background:var(--brass);color:var(--navy);border-color:transparent}</style>
