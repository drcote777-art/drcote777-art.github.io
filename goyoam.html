<style>
/* Layout: full-screen 3D walk; HUD floats — header top, guide subtitle center-top, actions right, chat dock bottom. Single light look over the scene. */
:root{
  --panel:#fbf7ee; --panel-a:rgba(251,247,238,.9); --ink:#2a241c; --muted:#6f6556; --line:#ddd2bd;
  --accent:#b5412e; --accent-ink:#fff; --gold:#c99a3a;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#cfe0ea;color:var(--ink);font-family:var(--body);overflow:hidden}
#app{position:relative;height:100%}
#cv{display:block;width:100%;height:100%;touch-action:none}
.hud{position:absolute;pointer-events:none}
.hud>*{pointer-events:auto}
.top{top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.brand{background:var(--panel-a);border:1px solid var(--line);border-radius:12px;padding:4px 9px;box-shadow:0 2px 8px #0002;max-width:min(46vw,260px);min-width:0}
.brand b{font-family:var(--display);font-weight:normal;font-size:14px}
.brand span{display:block;font-size:11px;line-height:1.35;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.right{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.chip{background:var(--panel-a);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:12px}
.btn{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:12px;padding:7px 11px;cursor:pointer;box-shadow:0 2px 10px #0002}
.top .btn{font-size:12px;padding:5px 9px;border-radius:10px}
.top .stat{padding:3px 8px;font-size:11px}.top .stat b{font-size:13px}.top .gi{width:40px}
.btn:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.45;cursor:default}
.sub{top:240px;left:50%;transform:translateX(-50%);width:min(560px,calc(100% - 32px));text-align:center;background:rgba(42,36,28,.78);color:#fff8ec;
  border-radius:14px;padding:10px 14px;font-size:15px;line-height:1.55;transition:opacity .6s}
.sub small{display:block;font-family:var(--display);color:#f3cf86;font-size:13px;margin-bottom:2px}
.sub.hide{opacity:0}
.bui{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:flex-end;gap:6px;pointer-events:none}
.bui>*{pointer-events:auto}
.acts{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px;max-width:100%}
#ctx{display:contents}
.act{font-family:var(--display);font-size:12.5px;padding:5px 10px;border-radius:999px;box-shadow:0 1px 5px #0002}
.act.mv{background:rgba(251,247,238,.82)}
.near{align-self:stretch;max-width:420px;margin-left:auto;background:rgba(251,247,238,.95);border:1px solid var(--line);border-radius:12px;padding:7px 30px 7px 10px;position:relative;box-shadow:0 2px 10px #0003}
.near b{display:block;font-family:var(--display);font-weight:normal;font-size:14px;color:var(--accent)}
.near p{margin:2px 0 0;font-size:12px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.near button{position:absolute;top:3px;right:4px;border:0;background:none;font-size:16px;color:var(--muted);cursor:pointer;padding:2px 6px}
.act.bell{background:var(--gold);color:#2a1d08;border-color:transparent}
.act.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.act.ctx{background:#3f5f4c;color:#fff;border-color:transparent}
.toast{left:50%;top:128px;transform:translateX(-50%);background:rgba(42,36,28,.78);color:#fff8ec;border-radius:999px;padding:6px 14px;font-size:13px;transition:opacity .4s}
.toast.hide{opacity:0}
.dock{left:0;right:0;bottom:0;padding:8px max(12px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));display:flex;gap:6px}
.dock input{flex:1;min-width:0;font:inherit;font-size:15px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.send{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-family:var(--display)}
.talk{left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));margin-inline:auto;max-width:520px;max-height:40%;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 6px 24px #0004;overflow:hidden}
.talk header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 10px;border-bottom:1px solid var(--line);font-family:var(--display);font-size:16px;color:var(--accent)}
.talk header .btn{font-family:var(--body);font-size:13px;padding:5px 10px;box-shadow:none}
.talkb{overflow-y:auto;padding:7px 10px;display:flex;flex-direction:column;gap:5px;font-size:13.5px;line-height:1.5}
.tl{max-width:88%;padding:6px 10px;border-radius:12px;background:#f3ecdd;align-self:flex-start;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.tl.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink)}
.logw{left:max(10px,env(safe-area-inset-left,0px));top:96px;max-width:min(300px,calc(100% - 24px));display:flex;flex-direction:column;gap:3px}
.logh{display:flex;gap:4px;align-items:center}
.logh .chipb{font-size:11px;padding:3px 8px;background:var(--panel-a)}
.log{position:static;max-height:96px;overflow-y:auto;background:var(--panel-a);border:1px solid var(--line);border-radius:10px;padding:4px 8px;font-size:12px;line-height:1.4}
.log:empty{display:none}
.logw.empty .logh{display:none}
.log b{font-weight:normal;font-family:var(--display)}
.joy{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;border:2px solid #ffffffaa;background:#ffffff22;pointer-events:none}
.joy i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px 0 0 -23px;border-radius:50%;background:#ffffffcc}
.hint{left:50%;bottom:calc(64px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);font-size:12px;color:#fff;background:rgba(42,36,28,.55);padding:4px 10px;border-radius:999px;white-space:nowrap}
.sheet{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,26,20,.55);padding:16px}
.card{background:var(--panel);border-radius:18px;padding:20px;width:min(380px,100%);display:flex;flex-direction:column;gap:11px;box-shadow:0 10px 40px #0006}
.card h2{margin:0;font-family:var(--display);font-weight:normal;font-size:26px}
.card p{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.card label{font-size:13px;color:var(--muted)}
.card input{font:inherit;font-size:16px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:#f3ecdd;color:var(--ink)}
.sws{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;cursor:pointer}
.sw[aria-pressed="true"]{border-color:var(--ink)}
.stat{background:var(--panel-a);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:12px;display:flex;gap:8px;align-items:center;font-variant-numeric:tabular-nums}
.stat b{font-family:var(--display);font-weight:normal;font-size:15px;color:var(--accent)}
.gi{width:54px;height:7px;border-radius:4px;background:#e4dccb;overflow:hidden}.gi i{display:block;height:100%;background:#4f8a5b;transition:width .4s}
.panel{position:absolute;inset:0;display:grid;place-items:center;background:rgba(30,26,20,.5);padding:16px}
.pcard{background:var(--panel);border-radius:18px;width:min(420px,100%);max-height:calc(100% - 20px);overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px #0006}
.pcard h2{margin:0;font-family:var(--display);font-weight:normal;font-size:23px}
.pcard h3{margin:6px 0 0;font-family:var(--display);font-weight:normal;font-size:16px;color:var(--accent)}
.pcard p{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item b{font-weight:normal;font-size:15px}.item small{grid-column:1;color:var(--muted);font-size:12px}
.item .btn{grid-row:1/3;grid-column:2;font-family:var(--display);box-shadow:none;font-variant-numeric:tabular-nums}
.earn{display:grid;grid-template-columns:1fr auto;gap:3px 12px;font-size:13px}.earn span:nth-child(even){text-align:right;font-variant-numeric:tabular-nums;color:var(--accent)}
.wish{font-size:13px;padding:5px 0;border-top:1px dashed var(--line)}.wish b{font-weight:normal;font-family:var(--display)}
.row{display:flex;gap:6px}.row input{flex:1;min-width:0;font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#f3ecdd;color:var(--ink)}
.lookp{position:absolute;left:0;right:0;bottom:0;max-height:54%;display:flex;justify-content:center;padding:0 max(8px,env(safe-area-inset-right,0px)) 0 max(8px,env(safe-area-inset-left,0px))}
.lcard{background:var(--panel);border-radius:18px 18px 0 0;width:min(560px,100%);overflow-y:auto;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 30px #0004;display:flex;flex-direction:column;gap:8px}
.lhead{display:flex;justify-content:space-between;align-items:center;gap:8px;position:sticky;top:-14px;background:var(--panel);padding-block:4px}
.lhead h2{margin:0;font-family:var(--display);font-weight:normal;font-size:20px}
.lsec{display:flex;flex-direction:column;gap:5px}.lsec>span{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chipb{font:inherit;font-size:13px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:#f3ecdd;color:var(--ink);cursor:pointer}
.chipb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.chipb:focus-visible,.sw:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sw.sm{width:28px;height:28px}
.lname{font:inherit;font-size:15px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#f3ecdd;color:var(--ink)}
.right{max-width:62vw}
.qbar{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));display:none;flex-direction:column;gap:8px;align-items:stretch;max-width:520px;margin-inline:auto}
body.quiet .qbar{display:flex}
body.quiet #logw,body.quiet .dock,body.quiet #bui,body.quiet #cnt,body.quiet #statBtn,body.quiet #hint{display:none!important}
.qstat{align-self:center;background:rgba(42,36,28,.62);color:#fff8ec;border-radius:999px;padding:5px 14px;font-size:13px;min-height:1em;text-align:center}
.qgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.qb{font-family:var(--display);font-size:15px;border:1px solid var(--line);background:rgba(251,247,238,.94);color:var(--ink);border-radius:14px;padding:10px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;box-shadow:0 2px 8px #0002;touch-action:manipulation}
.qb i{font-style:normal;font-size:22px;line-height:1}
.qb:active{transform:scale(.96)}
.qb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.qexit{align-self:center;font-size:12px;border:0;background:rgba(251,247,238,.75);border-radius:999px;padding:4px 12px;color:var(--muted);cursor:pointer}
.breath{position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,22,26,.55);z-index:5}
.bwrap{display:flex;flex-direction:column;align-items:center;gap:18px;color:#fff8ec;text-align:center;padding:16px}
.bcirc{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 40% 35%,#fff3d6,#e6b86a 55%,#b5412e);box-shadow:0 0 60px #f3cf8680;transform:scale(.55);transition:transform 4s ease-in-out}
.btxt{font-family:var(--display);font-size:22px;min-height:1.4em}
.bsub{font-size:13px;opacity:.85}
.bchips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.bchips .chipb{background:rgba(251,247,238,.9)}
.sheet .modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet .modes .btn{font-family:var(--display);font-size:15px;padding:12px 8px;line-height:1.3}
.sheet .modes .btn small{display:block;font-family:var(--body);font-size:11px;color:inherit;opacity:.8}
body.bigtext .act{font-size:15px;padding:7px 12px}body.bigtext .near b{font-size:17px}body.bigtext .near p{font-size:15px}
body.bigtext .talkb{font-size:16.5px}body.bigtext .brand b{font-size:16px}body.bigtext .brand span{font-size:13px}body.bigtext .log{font-size:14.5px}
body.bigtext .pcard p,body.bigtext .wish{font-size:15px}body.bigtext .item b{font-size:17px}body.bigtext .qb{font-size:17px}body.bigtext .qstat{font-size:15px}body.bigtext .toast{font-size:15px}body.bigtext .sub{font-size:17px}
.load{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:20px;color:var(--ink)}
@media (max-width:560px){.hint{display:none}.chip.cnt{font-size:11px;padding:3px 8px}}
@media (prefers-reduced-motion:reduce){.sub{transition:none}}
</style>

<div id="app">
  <canvas id="cv" aria-label="3D 산사 가는 길. 끌어서 둘러보고, 왼쪽 아래를 눌러 걸어갑니다"></canvas>
  <div class="load" id="load">산길을 만드는 중…</div>

    <div class="brand"><b>고요암 가는 길</b><span id="zone">산문 입구</span><span id="wx"></span><span id="clock"></span></div>
    <div class="right"><span class="chip cnt" id="cnt">👣 혼자</span><button class="stat btn" id="statBtn" type="button" aria-label="공덕과 체험 보기">공덕 <b id="gd">0</b><span class="gi"><i id="gi" style="width:100%"></i></span>기력</button><button class="btn" id="dmBtn" type="button">💌 쪽지</button><button class="btn" id="goBtn" type="button">📍 이동</button><button class="btn" id="quietBtn" type="button">🪷 고요</button><button class="btn" id="sndBtn" type="button" aria-pressed="true">🔈 소리</button><button class="btn" id="meBtn" type="button">👤 꾸미기</button></div>
  </div>
  <div class="hud sub hide" id="sub"><small>안내 스님</small><span id="subText"></span></div>
  <div class="hud logw empty" id="logw"><div class="logh"><button class="chipb" id="logFold" type="button">채팅 접기</button><button class="chipb" id="logClear" type="button">내 화면 비우기</button><button class="chipb" id="logWipe" type="button" hidden>모두 지우기</button></div><div class="log" id="log" aria-live="polite"></div></div>
  <div class="hud talk" id="talk" hidden><header><span id="talkName"></span><span style="display:flex;gap:5px"><button class="btn" id="talkVoice" type="button" aria-pressed="true">🔊 음성</button><button class="btn" id="talkEnd" type="button">대화 마치기</button></span></header><div class="talkb" id="talkBody" aria-live="polite"></div></div>
  <div class="hud toast hide" id="toast" aria-live="polite"></div>

    <div id="ctx"></div>

    <button class="btn act ctx" id="aWash" type="button" hidden>설거지 돕기</button>
    <button class="btn act ctx" id="aTea" type="button" hidden>차 주문하기</button>
    <button class="btn act ctx" id="aSpring" type="button" hidden>약수 마시기</button>
    <button class="btn act ctx" id="aMonk" type="button" hidden>스님께 묻기</button>
    <button class="btn act ctx" id="aInc" type="button" hidden>향 피우기</button>
    <button class="btn act ctx" id="aCan" type="button" hidden>초 켜기</button>
    <button class="btn act bell" id="aBell" type="button" hidden>범종 치기</button>
    <button class="btn act mv" id="aMoves" type="button" aria-expanded="false">동작 ▾</button>
    <button class="btn act mv" id="aHap" type="button" hidden>합장</button>
    <button class="btn act mv" id="aBow" type="button" hidden>삼배</button>
    <button class="btn act mv" id="aMok" type="button" hidden>목탁</button>
    <button class="btn act mv" id="aBroom" type="button" aria-pressed="false" hidden>빗자루 들기</button>
    </div>
  </div>
  <div class="hud hint" id="hint">W A S D로 걷기 · 끌어서 둘러보기</div>
  <div class="qbar" id="qbar">
    <div class="qstat" id="qstat">고요 모드 · 말없이 마음을 내려놓는 시간</div>

  <div class="lookp" id="lookP" hidden><div class="lcard"><div class="lhead"><h2>내 캐릭터 꾸미기</h2><button class="btn send" id="lookDone" type="button">완료</button></div><div id="lookBody" class="lsec" style="gap:10px"></div></div></div>

/* ================= 계절과 날씨: 실제 날짜(한국 시간) 기준, 하루에 한 번 바뀝니다 ================= */
function kstDate(off){const d=new Date(Date.now()+9*3600e3+(off||0)*864e5);return{m:d.getUTCMonth()+1,d:d.getUTCDate(),key:d.toISOString().slice(0,10)}}

  let kind=x<P[0]?"sunny":x<P[0]+P[1]?"cloudy":x<P[0]+P[1]+P[2]?"rain":"snow";
  if((k.m===11&&k.d>=20||k.m===3&&k.d<=10)&&kind==="rain"&&r()<.5)kind="snow";

  return WX.real?base+`계룡 ${WX.temp!=null?WX.temp.toFixed(0)+"°C ":""}${WX.phrase||WX_KO[WX.kind]}`+tail:base+WX_KO[WX.kind]+tail+" (가상 날씨)"}
